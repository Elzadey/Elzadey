name: Update stats
on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        run: python scripts/gen_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Elzadey
          outputs: |
            assets/snake.svg?color_snake=#d4e157&color_dots=#1c1f17,#3f4a22,#6b7a2f,#a3b83f,#d4e157

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if ! git diff --staged --quiet; then
            git commit -m "chore: update stats"
            git push
          fi
