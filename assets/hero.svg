<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
<style>
  .eb{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:3px;fill:#d9774a}
  .h{font:700 62px 'Helvetica Neue',Arial,sans-serif;letter-spacing:-2px;fill:#f4ece4}
  .p{fill:#d9774a}
  .i{font:italic 400 66px Georgia,'Times New Roman',serif;fill:#d9774a}
  .sub{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#a89f96}
  .tag{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1.5px;fill:#f4ece4}
  .up{opacity:0;animation:up .8s ease forwards}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
</style>
<defs>
  <radialGradient id="s" cx="35%" cy="30%" r="75%">
    <stop offset="0" stop-color="#ffe3d0"/><stop offset=".25" stop-color="#d9774a"/>
    <stop offset=".7" stop-color="#7a3418"/><stop offset="1" stop-color="#241109"/>
  </radialGradient>
  <radialGradient id="g" cx="50%" cy="50%" r="50%">
    <stop offset="0" stop-color="#d9774a" stop-opacity=".35"/><stop offset="1" stop-color="#d9774a" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
    <path d="M18 0H0V18" fill="none" stroke="#3a1a0e" stroke-opacity=".7"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="18 0" dur="4s" repeatCount="indefinite"/>
  </pattern>
  <clipPath id="c"><circle cx="690" cy="215" r="95"/></clipPath>
</defs>

<rect width="900" height="420" rx="14" fill="#14110f"/>

<text x="40" y="48" class="eb up">—  DATA ENGINEER / AI BUILDER</text>
<text x="40" y="118" class="h up" style="animation-delay:.15s">From raw</text>
<text x="40" y="178" class="h up" style="animation-delay:.3s">data</text>
<text x="40" y="238" class="h p up" style="animation-delay:.45s">to real</text>
<text x="40" y="308" class="i up" style="animation-delay:.6s">intelligence.</text>
<text x="40" y="350" class="sub up" style="animation-delay:.8s">I build the systems behind better decisions — starting with</text>
<text x="40" y="374" class="sub up" style="animation-delay:.9s">clean data, then adding the intelligence to make it move.</text>

<circle cx="690" cy="215" r="170" fill="url(#g)">
  <animate attributeName="opacity" values=".6;1;.6" dur="4s" repeatCount="indefinite"/>
</circle>
<ellipse cx="690" cy="215" rx="150" ry="48" fill="none" stroke="#d9774a" stroke-opacity=".35" transform="rotate(-15 690 215)">
  <animateTransform attributeName="transform" type="rotate" from="-15 690 215" to="345 690 215" dur="30s" repeatCount="indefinite"/>
</ellipse>
<circle cx="690" cy="215" r="95" fill="url(#s)"/>
<rect x="595" y="120" width="190" height="190" fill="url(#grid)" clip-path="url(#c)"/>
<circle cx="690" cy="215" r="95" fill="none" stroke="#d9774a" stroke-opacity=".3"/>

<circle cx="560" cy="130" r="5" fill="#d9774a"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="835" cy="330" r="6" fill="#d9774a"><animate attributeName="opacity" values=".3;1;.3" dur="3s" repeatCount="indefinite"/></circle>
<circle cx="840" cy="225" r="4" fill="#8a9299"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="325" r="3" fill="#d9774a"><animate attributeName="opacity" values=".2;1;.2" dur="2.8s" repeatCount="indefinite"/></circle>

<rect x="770" y="90" width="112" height="28" fill="#14110f" stroke="#3a2e27"/>
<circle cx="784" cy="104" r="4" fill="#d9774a"/>
<text x="794" y="108" class="tag">DATA / READY</text>
<rect x="520" y="330" width="146" height="28" fill="#14110f" stroke="#3a2e27"/>
<text x="530" y="348" class="tag"><tspan fill="#a89f96">01  </tspan><tspan fill="#d9774a">AI LAYER ADDED</tspan></text>
</svg>
